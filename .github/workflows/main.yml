name: Build Mush8 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Dependencies
        run: |
          brew install xcodegen
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
          rustup target add aarch64-apple-ios-sim --toolchain 1.98.1

      - name: Setup prod.keys
        run: |
          cat << 'EOF' > prod.keys
          ${{ secrets.PROD_KEYS }}
          EOF

      - name: Build iOS IPA
        run: |
          chmod +x make-ios.sh
          ./make-ios.sh --ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-IPA
          path: build/Mush8.ipa
